(function(){var q=new URLSearchParams(location.search),r=document.documentElement;var t=q.get('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');r.dataset.theme=t;
var tb=document.getElementById('themebtn');tb.onclick=function(){r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'};if(q.get('chrome')==='0')tb.style.display='none';
var s=document.getElementById('sheet');if(s){document.querySelectorAll('[data-open-sheet]').forEach(function(b){b.onclick=function(){s.classList.add('open')}});
document.querySelectorAll('[data-close-sheet]').forEach(function(b){b.onclick=function(){s.classList.remove('open')}});if(q.get('sheet')==='1')s.classList.add('open');}
document.querySelectorAll('[data-dismiss]').forEach(function(b){b.onclick=function(){b.closest('[data-nudge]').remove()}});
document.querySelectorAll('[aria-pressed]').forEach(function(b){b.addEventListener('click',function(){var g=b.parentElement;if(g.classList.contains('seg')||g.dataset.single){g.querySelectorAll('[aria-pressed]').forEach(function(x){x.setAttribute('aria-pressed','false')});b.setAttribute('aria-pressed','true')}else{b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')==='true'?'false':'true')}})});
document.querySelectorAll('.switch').forEach(function(b){b.onclick=function(){b.setAttribute('aria-checked',b.getAttribute('aria-checked')==='true'?'false':'true')}});
})();
</script></body></html>
