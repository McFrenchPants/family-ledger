<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Family Ledger</title>
    <script>
      // Apply the stored light/dark choice before first paint (no flash).
      // Must use the same key as THEME_STORAGE_KEY in src/lib/theme.ts.
      try {
        var t = window.localStorage.getItem("family-ledger.theme");
        if (t === "light" || t === "dark")
          document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
